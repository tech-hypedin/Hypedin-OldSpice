services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oldspice-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - oldspice-network

networks:
  oldspice-network:
    external: true
    name: oldspice-network